# Cau hinh SMTP de gui OTP. Voi Gmail: bat 2FA va tao "App password" (16 ky tu) roi dien vao mail.password.
# KHONG commit mat khau that len GitHub. Dung bien moi truong MAIL_USER / MAIL_PASSWORD de gui mail that.
# Co the ghi de bang bien moi truong: MAIL_HOST, MAIL_PORT, MAIL_USER, MAIL_PASSWORD, MAIL_STARTTLS
mail.host=smtp.gmail.com
mail.port=587
mail.starttls=true
mail.user=your-email@gmail.com
mail.password=your-app-password
mail.from.name=BookStore 24110317
# true: luon in OTP ra console server (tien cho test khi chua cau hinh SMTP). Nen dat false khi nop bai/deploy that.
mail.log-otp=true
