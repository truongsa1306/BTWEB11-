# Cau hinh JDBC SQL Server (co the ghi de bang bien moi truong DB_URL, DB_USER, DB_PASSWORD, DB_DRIVER)
# Yeu cau: SQL Server bat TCP/IP (port 1433) va Mixed Mode Authentication (dang nhap sa).
db.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
db.url=jdbc:sqlserver://localhost:1433;databaseName=BookStore;encrypt=true;trustServerCertificate=true
db.user=sa
db.password=123
